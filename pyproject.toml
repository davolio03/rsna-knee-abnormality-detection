[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-abnormality-detection"
version = "0.1.0"
description = "Research code for RSNA knee abnormality detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
images = ["numpy>=2.0", "Pillow>=10.0", "pydicom>=2.4"]
siwc = ["Authlib==1.8.0", "requests==2.34.2", "keyring==25.7.0", "truststore==0.10.5", "openai==2.11.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["rsna_knee", "rsna_knee.*"]

[tool.setuptools.package-data]
rsna_knee = ["labels/codex_label_output.schema.json"]
