[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-abnormality-detection"
version = "1.0.0"
description = "Study-level knee MRI abnormality detection with target-specific attention MIL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Sulleiro Albi"}]
keywords = ["medical-imaging", "mri", "knee", "multiple-instance-learning", "attention", "pytorch", "kaggle"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.urls]
Homepage = "https://davolio03.github.io/rsna-knee-abnormality-detection/"
Repository = "https://github.com/davolio03/rsna-knee-abnormality-detection"

[project.optional-dependencies]
images = ["numpy>=2.0", "Pillow>=10.0", "pydicom>=2.4"]
# PyTorch is installed separately to match the local CUDA build (see README).
train = ["numpy>=2.0", "Pillow>=10.0", "pydicom>=2.4", "torch>=2.11", "torchvision>=0.26"]
siwc = ["Authlib==1.8.0", "requests==2.34.2", "keyring==25.7.0", "truststore==0.10.5", "openai==2.11.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["rsna_knee", "rsna_knee.*"]

[tool.setuptools.package-data]
rsna_knee = ["labels/codex_label_output.schema.json"]
